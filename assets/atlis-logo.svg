<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="ATLIS logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ATLIS</title>

  <!-- square white canvas -->
  <rect x="0" y="0" width="400" height="400" fill="#FFFFFF"/>

  <!-- mark, centered in the square -->
  <g transform="translate(0,-8)">

    <!-- caret "A" roofline: uniform stroke, sharp mitered apex -->
    <path d="M100 200 L200 110 L300 200" fill="none" stroke="#111111"
          stroke-width="26" stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="6"/>

    <!-- line tapering down from beneath the apex to a point -->
    <path d="M186 150 L214 150 L200 300 Z" fill="#111111"/>

    <!-- crossbar accent (dark blue) -->
    <rect x="120" y="160" width="160" height="16" rx="3" fill="#1E3A8A"/>

    <!-- terminal accent (dark blue) -->
    <polygon points="200,307 210,316 200,325 190,316" fill="#1E3A8A"/>

  </g>
</svg>
